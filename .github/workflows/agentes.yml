# Chama os agentes automáticos (lembretes, retornos, avaliações, orçamentos, página da manhã) a cada 10 minutos.
# Configure em Settings → Secrets and variables → Actions:
#   APP_URL     endereço do sistema, ex.: https://agentes-ia.vercel.app
#   CRON_SECRET o mesmo valor da variável CRON_SECRET na Vercel
name: Agentes
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Configure APP_URL e CRON_SECRET nos secrets"; exit 0; fi
          curl -fsS --max-time 280 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron"
